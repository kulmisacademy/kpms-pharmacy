org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Work around Kotlin daemon incremental cache failures ("Storage ... is already registered",
# "Could not close incremental caches") seen when compiling Flutter plugins (e.g. image_picker_android, share_plus).
kotlin.incremental=false
kotlin.incremental.android=false
