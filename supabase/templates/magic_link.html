<!DOCTYPE html>
<html>
<body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #0f172a;">
  <h2 style="margin-bottom: 8px;">Your sign-in code</h2>
  <p>Use this code in the <strong>KULMIS KPMS</strong> app to continue (for example, resetting your password):</p>
  <p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; margin: 16px 0;">{{ .Token }}</p>
  <p style="color: #64748b; font-size: 14px;">If you did not request this, you can ignore this email.</p>
  <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;" />
  <p style="font-size: 13px; color: #64748b;">Optional — sign in on the web:</p>
  <p><a href="{{ .ConfirmationURL }}" style="color: #16a34a;">Continue in browser</a></p>
</body>
</html>
