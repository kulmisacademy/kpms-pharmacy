<!DOCTYPE html>
<html>
<body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #0f172a;">
  <h2 style="margin-bottom: 8px;">Reset your password</h2>
  <p>Enter this code in the <strong>KULMIS KPMS</strong> app:</p>
  <p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; margin: 16px 0;">{{ .Token }}</p>
  <p style="color: #64748b; font-size: 14px;">If you did not request a reset, ignore this message.</p>
  <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;" />
  <p style="font-size: 13px; color: #64748b;">Web only — password reset link:</p>
  <p><a href="{{ .ConfirmationURL }}" style="color: #16a34a;">Reset password</a></p>
</body>
</html>
